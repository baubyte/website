services:
  web:
    volumes:
      # Read-only bind mount of the legacy CodeIgniter app's uploaded files so
      # `legacy:import` can copy profile avatars (and any future uploads) into
      # the new app's storage. The legacy repo lives outside this project's
      # own DDEV-managed mount, so it must be attached explicitly here.
      - "/home/baubyte/Devs/Baubyte/Projects/website-old/writable/uploads:/legacy-uploads:ro"
