name: Construir y Publicar Docker

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en el registro de contenedores (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y subir imagen Web (PHP/Nginx)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: web
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:web-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Construir y subir imagen SSR (Node)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: ssr
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ssr-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
